<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Lapor Lokasi Kotor - CleanEarth</title>
		<style>
			:root {
				--primary: #2c3e50;
				--secondary: #34495e;
				--accent: #3498db;
				--success: #27ae60;
				--light: #ecf0f1;
				--white: #ffffff;
				--text: #333333;
				--text-light: #7f8c8d;
				--border-color: #bdc3c7;
			}

			body {
				background: #f0f2f5;
				font-family: "Inter", "Segoe UI", Arial, sans-serif;
				margin: 0;
				padding: 0;
				color: var(--text);
				line-height: 1.6;
			}

			.main-content {
				padding: 30px 20px;
				box-sizing: border-box;
				max-width: 700px;
				margin: 50px auto;
			}

			.lapor-section h2 {
				color: var(--primary);
				margin-bottom: 10px;
				font-size: 2.2em;
				font-weight: 700;
				text-align: center;
			}

			.lapor-section p.subtitle {
				color: var(--text-light);
				margin-bottom: 30px;
				font-size: 1.1em;
				text-align: center;
				max-width: 500px;
				margin-left: auto;
				margin-right: auto;
			}

			.form-container {
				background: var(--white);
				padding: 30px 35px;
				border-radius: 15px;
				box-shadow: 0 5px 25px rgba(0, 0, 0, 0.07);
				border: 1px solid #e0e0e0;
			}

			.form-group {
				margin-bottom: 20px;
			}

			.form-group label {
				display: block;
				margin-bottom: 8px;
				font-weight: 600;
				color: var(--secondary);
				font-size: 0.95em;
			}

			.form-group input,
			.form-group textarea {
				width: 100%;
				padding: 12px 15px;
				border: 1px solid var(--border-color);
				border-radius: 8px;
				font-size: 1em;
				font-family: "Inter", sans-serif;
				transition: border-color 0.3s, box-shadow 0.3s;
				box-sizing: border-box;
			}

			.form-group input:focus,
			.form-group textarea:focus {
				outline: none;
				border-color: var(--accent);
				box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
			}

			.form-group textarea {
				min-height: 120px;
				resize: vertical;
			}

			/* Custom File Input */
			.file-input-wrapper {
				position: relative;
				overflow: hidden;
				display: inline-block;
				width: 100%;
				border: 1px dashed var(--border-color);
				border-radius: 8px;
				padding: 25px 15px;
				text-align: center;
				cursor: pointer;
				transition: border-color 0.3s, background-color 0.3s;
			}

			.file-input-wrapper:hover {
				border-color: var(--accent);
				background-color: #f8f9fa;
			}

			.file-input-wrapper input[type="file"] {
				position: absolute;
				font-size: 100px;
				left: 0;
				top: 0;
				opacity: 0;
				cursor: pointer;
			}

			.file-input-label {
				color: var(--text-light);
				cursor: pointer;
			}

			#fileName {
				margin-top: 10px;
				font-style: italic;
				color: var(--accent);
				font-weight: 500;
			}

			.submit-button {
				width: 100%;
				padding: 15px;
				background-color: var(--accent);
				color: var(--white);
				border: none;
				border-radius: 8px;
				font-size: 1.1em;
				font-weight: 700;
				cursor: pointer;
				transition: background-color 0.3s, transform 0.2s;
			}

			.submit-button:hover {
				background-color: #2980b9;
				transform: translateY(-2px);
			}

			/* Modal Styles */
			.modal-overlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.6);
				display: none; /* Hidden by default */
				align-items: center;
				justify-content: center;
				z-index: 1000;
				backdrop-filter: blur(3px);
				opacity: 0;
				transition: opacity 0.3s ease;
			}

			.modal-overlay.show {
				display: flex;
				opacity: 1;
			}

			.modal-content {
				background: var(--white);
				padding: 30px 40px;
				border-radius: 15px;
				text-align: center;
				max-width: 400px;
				width: 90%;
				transform: scale(0.9);
				transition: transform 0.3s ease;
			}

			.modal-overlay.show .modal-content {
				transform: scale(1);
			}

			.modal-icon {
				font-size: 50px;
				color: var(--success);
			}

			.modal-content h3 {
				color: var(--primary);
				margin: 15px 0 10px;
			}

			.modal-content p {
				color: var(--text-light);
				margin-bottom: 20px;
			}

			.modal-close-button {
				padding: 10px 25px;
				background-color: var(--accent);
				color: var(--white);
				border: none;
				border-radius: 8px;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
	</head>

	<body>
		<div id="navbar-placeholder"></div>
		<div class="main-content">
			<div class="lapor-section">
				<h2>Lapor Lokasi Kotor</h2>
				<p class="subtitle">
					Lihat tumpukan sampah atau lingkungan yang tidak terawat? Bantu kami
					dengan melaporkannya di sini.
				</p>

				<div class="form-container">
					<form id="laporForm">
						<div class="form-group">
							<label for="nama">Nama Pelapor</label>
							<input
								type="text"
								id="nama"
								name="nama"
								placeholder="Masukkan nama Anda"
								required />
						</div>
						<div class="form-group">
							<label for="email">Email (Opsional)</label>
							<input
								type="email"
								id="email"
								name="email"
								placeholder="contoh@email.com" />
						</div>
						<div class="form-group">
							<label for="lokasi">Alamat/Detail Lokasi</label>
							<textarea
								id="lokasi"
								name="lokasi"
								placeholder="Contoh: Jl. Pahlawan No. 10, di depan taman bermain."
								required></textarea>
						</div>
						<div class="form-group">
							<label for="foto">Unggah Foto Lokasi</label>
							<div class="file-input-wrapper">
								<input
									type="file"
									id="foto"
									name="foto"
									accept="image/*"
									required />
								<span class="file-input-label">Klik untuk memilih file...</span>
							</div>
							<div id="fileName"></div>
						</div>
						<button
							type="submit"
							class="submit-button">
							Kirim Laporan
						</button>
					</form>
				</div>
			</div>
		</div>

		<div
			class="modal-overlay"
			id="successModal">
			<div class="modal-content">
				<div class="modal-icon">✔</div>
				<h3>Laporan Terkirim!</h3>
				<p>
					Terima kasih atas kepedulian Anda. Laporan Anda sangat berarti untuk
					mewujudkan lingkungan yang lebih bersih.
				</p>
				<button
					class="modal-close-button"
					id="closeModal">
					Selesai
				</button>
			</div>
		</div>

		<script>
			document.addEventListener("DOMContentLoaded", function () {
				const form = document.getElementById("laporForm");
				const successModal = document.getElementById("successModal");
				const closeModalButton = document.getElementById("closeModal");
				const fileInput = document.getElementById("foto");
				const fileNameDisplay = document.getElementById("fileName");

				// Handle form submission
				form.addEventListener("submit", function (event) {
					event.preventDefault(); // Mencegah form mengirim data secara default

					// Di aplikasi nyata, di sini Anda akan mengirim data ke server
					// menggunakan fetch() atau AJAX.
					// Untuk contoh ini, kita langsung tampilkan modal sukses.

					successModal.classList.add("show");

					form.reset(); // Mengosongkan form setelah berhasil
					fileNameDisplay.textContent = ""; // Mengosongkan nama file
				});

				// Handle file input change to display file name
				fileInput.addEventListener("change", function () {
					if (fileInput.files.length > 0) {
						fileNameDisplay.textContent = `File terpilih: ${fileInput.files[0].name}`;
					} else {
						fileNameDisplay.textContent = "";
					}
				});

				// Function to close the modal
				const closeModal = () => {
					successModal.classList.remove("show");
				};

				// Close modal via button
				closeModalButton.addEventListener("click", closeModal);

				// Close modal by clicking the overlay
				successModal.addEventListener("click", function (event) {
					if (event.target === successModal) {
						closeModal();
					}
				});
			});
		</script>

		<script src="js/navbar_simple.js"></script>
		<script>
			// Render navbar
			renderNavbarPublic("lapor");
		</script>
	</body>
</html>
