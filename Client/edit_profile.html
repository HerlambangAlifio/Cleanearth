  <div class="main-content">
    <div class="profile-edit-card">
      <h2 style="margin-bottom: 8px; color: #2c3e50; font-weight: 700;">Edit Profil</h2>
      <p style="color: #6c757d; margin-bottom: 24px;">Perbarui informasi profil Anda</p>
      <div class="profile-edit-avatar">
        <img id="currentPhoto" src="" alt="Foto Profil" style="display:none;">
        <div id="photoPlaceholder" class="profile-avatar" style="display:flex; align-items:center; justify-content:center; font-size:2.5rem; background:#e3eafc; color:#3498db; width:110px; height:110px; margin:0 auto; border-radius:50%; border:4px solid #3498db;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <label for="photoFile" class="profile-edit-upload-btn">Ubah Foto</label>
        <input type="file" id="photoFile" class="profile-edit-upload-input" accept="image/*" hidden>
        <p style="margin-top: 8px; font-size: 0.9rem; color: #6c757d;">Format: JPG, PNG, GIF (Max: 2MB)</p>
      </div>
      <form id="profileForm" style="margin-top: 18px;">
        <div class="profile-edit-form-group">
          <label>Username</label>
          <input type="text" id="username" name="username" readonly>
        </div>
        <div class="profile-edit-form-group">
          <label>Email</label>
          <input type="email" id="email" name="email" readonly>
        </div>
        <div class="profile-edit-form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="namaLengkap" name="nama_lengkap" placeholder="Masukkan nama lengkap Anda">
        </div>
        <div class="profile-edit-form-group">
          <label>Alamat</label>
          <textarea id="alamat" name="alamat" placeholder="Masukkan alamat lengkap Anda"></textarea>
        </div>
        <div class="profile-edit-form-group">
          <label>Nomor HP</label>
          <input type="tel" id="noHp" name="no_hp" placeholder="Masukkan nomor HP Anda">
        </div>
        <div class="profile-edit-actions">
          <button type="button" class="btn-edit-secondary" onclick="goBack()">Kembali</button>
          <button type="submit" class="btn-edit-primary" id="saveBtn">Simpan Perubahan</button>
        </div>
      </form>
      <div id="alertContainer" style="margin-top:18px;"></div>
    </div>

  <script>
    // Check authentication
    (function() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      try {
        const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        if (payload.role !== 'user') {
          alert('Anda tidak memiliki akses ke halaman ini');
          localStorage.removeItem('token');
          window.location.href = 'login.html';
          return;
        }
        // Set user info dari JWT token
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const displayName = payload.username || 'User';
        userName.textContent = displayName;
        userAvatar.textContent = displayName.charAt(0).toUpperCase();
        // Load profile data
        loadProfileData();
      } catch (error) {
        alert('Token tidak valid');
        localStorage.removeItem('token');
        window.location.href = 'login.html';
      }
    })();
    // Load profile data dari database
    async function loadProfileData() {
      try {
        const response = await fetch('http://localhost:5000/api/user/me', {
          headers: {
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          }
        });
        if (response.ok) {
          const userData = await response.json();
          document.getElementById('username').value = userData.username || '';
          document.getElementById('email').value = userData.email || '';
          document.getElementById('namaLengkap').value = userData.Profile?.nama_lengkap || '';
          document.getElementById('alamat').value = userData.Profile?.alamat || '';
          document.getElementById('noHp').value = userData.Profile?.no_hp || '';
          // Load profile photo
          if (userData.Profile?.foto_profil) {
            document.getElementById('photoPlaceholder').style.display = 'none';
            document.getElementById('currentPhoto').src = `http://localhost:5000/uploads/${userData.Profile.foto_profil}`;
            document.getElementById('currentPhoto').style.display = 'block';
          } else {
            document.getElementById('photoPlaceholder').style.display = 'flex';
            document.getElementById('currentPhoto').style.display = 'none';
          }
        } else {
          showAlert('Gagal memuat data profil', 'error');
        }
      } catch (error) {
        showAlert('Gagal memuat data profil', 'error');
      }
    }
    // Handle file upload preview
    document.getElementById('photoFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        if (file.size > 2 * 1024 * 1024) {
          showAlert('Ukuran file terlalu besar. Maksimal 2MB.', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('photoPlaceholder').style.display = 'none';
          document.getElementById('currentPhoto').src = e.target.result;
          document.getElementById('currentPhoto').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });
    // Handle form submission
    document.getElementById('profileForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Menyimpan...';
      try {
        const formData = new FormData();
        formData.append('username', document.getElementById('username').value);
        formData.append('email', document.getElementById('email').value);
        formData.append('nama_lengkap', document.getElementById('namaLengkap').value);
        formData.append('alamat', document.getElementById('alamat').value);
        formData.append('no_hp', document.getElementById('noHp').value);
        const photoFile = document.getElementById('photoFile').files[0];
        if (photoFile) {
          formData.append('foto_profil', photoFile);
        }
        const response = await fetch('http://localhost:5000/api/user/me', {
          method: 'PATCH',
          headers: {
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          },
          body: formData
        });
        const data = await response.json();
        if (response.ok) {
          showAlert('Profil berhasil diperbarui!', 'success');
        } else {
          showAlert(data.message || 'Gagal memperbarui profil', 'error');
        }
      } catch (error) {
        showAlert('Gagal memperbarui profil', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Simpan Perubahan';
      }
    });
    // Show alert message
    function showAlert(message, type) {
      const alertContainer = document.getElementById('alertContainer');
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.textContent = message;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alertDiv);
      setTimeout(() => {
        alertDiv.remove();
      }, 5000);
    }
    // Go back to dashboard
    function goBack() {
      window.location.href = 'dashboard_user.html';
    }
    // Logout
    function logout() {
      if (confirm('Yakin ingin logout?')) {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
      }
    }
  </script>
